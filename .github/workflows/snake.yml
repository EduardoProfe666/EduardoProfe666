name: Generate snake animation

on:
  schedule:
    # Once a day is plenty: the snake only reflects the contribution graph.
    # This used to run every hour, 24x more Actions minutes for the same result.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    # The default branch is `main`; this said `master`, so the push trigger
    # never fired and the snake only ever updated on the schedule.
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # `snake.svg` keeps the dark palette it has always had, so the URL
          # the README already points at does not change meaning. The light
          # variant is new; once this workflow has run at least once, the
          # <picture> block in the README can be switched on.
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET || secrets.GITHUB_TOKEN }}
