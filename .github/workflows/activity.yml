name: Github Activity

on:
  schedule:
    # Every six hours. Hourly was 24 commits a day to this repo for a list that
    # rarely changes that fast.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Update this repo's README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET || secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 10
          COMMIT_NAME: GitHub Activity Readme
